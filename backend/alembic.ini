# A generic, single database configuration.

[alembic]
# path to migration scripts
script_location = migrations

# file naming template for new revisions
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(rev)s_%%(slug)s

# sys.path adjustment for model discovery
prepend_sys_path = .

# timezone for the generated revision dates
timezone = UTC

# version table in the database
version_table = alembic_version

# max length of characters in a slug
truncate_slug_length = 40

# The sqlalchemy.url is intentionally left blank here.
# It is set programmatically in migrations/env.py from the DATABASE_URL
# environment variable so that credentials never live in source control.
sqlalchemy.url =

[post_write_hooks]
# Optionally auto-format generated migration files:
# hooks = black
# black.type = console_scripts
# black.entrypoint = black
# black.options = -l 88 REVISION_SCRIPT_FILENAME

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
